<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<meta name="apple-mobile-web-app-title" content="플래너"/>
<title>데일리 플래너</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet"/>
<style>
:root{color-scheme:light;--bg:#f5f4ef;--surface:#fffefa;--soft:#eeeee7;--line:#dddfd5;--ink:#303d37;--muted:#677269;--green:#38624f;--green-soft:#e6eee5;--blue:#46677e;--blue-bg:#eaf0f5;--red:#a65450;--red-bg:#faeeea;--shadow:0 5px 22px #303d3706;--r:20px}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{background:var(--bg);color:var(--ink);font-family:'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;font-size:15px;line-height:1.7;-webkit-font-smoothing:antialiased}
body{max-width:560px;margin:0 auto;min-height:100vh;padding:0 12px 28px}
button,input,textarea{font:inherit}button{cursor:pointer}button,input,textarea{color:inherit}button{touch-action:manipulation}input{min-width:0}button:focus-visible,input:focus-visible,textarea:focus-visible,.tab:focus-visible{outline:2px solid var(--green);outline-offset:3px}::placeholder{color:var(--muted);opacity:1}::selection{background:var(--green-soft)}
.app-header{padding:calc(env(safe-area-inset-top) + 32px) 12px 25px}.header-top{display:flex;align-items:center;justify-content:space-between;gap:12px}.app-title-sub{color:var(--green);font-size:10px;font-weight:700;letter-spacing:.19em;margin-bottom:6px}.app-title{font-size:25px;font-weight:700;letter-spacing:-1px}.week-badge{font-size:11px;white-space:nowrap;color:var(--green);background:var(--green-soft);border:1px solid var(--line);border-radius:999px;padding:6px 10px}
.tab-bar{display:flex;background:var(--soft);padding:5px;border-radius:15px;margin:0 8px 22px;gap:5px}.tab{flex:1;text-align:center;padding:11px 4px;border:0;border-radius:11px;color:var(--muted);background:transparent;font-weight:600;font-size:14px;cursor:pointer;transition:background .2s,color .2s}.tab.active{background:var(--surface);color:var(--green);box-shadow:0 2px 6px #303d370b}
.content{padding:0 8px calc(24px + env(safe-area-inset-bottom))}.page{display:none}.page.active{display:block}.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);margin-bottom:18px;box-shadow:var(--shadow);overflow:hidden}.card-header{display:flex;align-items:center;gap:10px;padding:18px 20px 12px}.card-icon{width:32px;height:32px;background:var(--soft);border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0}.card-title{font-size:14px;font-weight:700;letter-spacing:-.3px}.card-body{padding:8px 20px 20px}
.week-nav{display:flex;align-items:center;gap:8px;margin:0 0 16px}.week-nav-btn{width:40px;height:40px;flex-shrink:0;border:1px solid var(--line);border-radius:12px;background:var(--surface);color:var(--green);font-size:23px;line-height:1}.week-label-big{flex:1;text-align:center;font-weight:600;font-size:15px;letter-spacing:-.4px}.week-dates-row,.day-bar{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px}.week-date-cell{text-align:center;padding:9px 0;border:1px solid transparent;border-radius:12px;background:var(--soft)}.wdc-day{font-size:11px;font-weight:500;color:var(--muted)}.wdc-date{font-size:16px;font-weight:600;margin-top:3px;font-variant-numeric:tabular-nums}.wdc-today{background:var(--green);color:#fff}.wdc-today .wdc-day{color:#fff}.wdc-sat:not(.wdc-today){background:var(--blue-bg);color:var(--blue)}.wdc-sat:not(.wdc-today) .wdc-day{color:var(--blue)}.wdc-red:not(.wdc-today){background:var(--red-bg);color:var(--red)}.wdc-red:not(.wdc-today) .wdc-day{color:var(--red)}
.sec-divider{display:flex;align-items:center;gap:10px;margin:4px 0 10px}.sdiv-bar{flex:1;height:1px;background:var(--line)}.sdiv-label{font-size:12px;font-weight:500;color:var(--muted)}textarea.field{display:block;width:100%;border:1px solid var(--line);border-radius:12px;background:var(--bg);resize:vertical;min-height:100px;padding:13px 14px;font-size:15px;line-height:1.9}table.gt,.sch-table{width:100%;border-collapse:collapse;table-layout:fixed}table.gt th,.sch-table th{background:var(--soft);padding:10px 12px;color:var(--muted);font-size:12px;font-weight:500;text-align:left;border-bottom:1px solid var(--line)}table.gt td{padding:10px 12px;border-bottom:1px solid var(--line)}table.gt tr:last-child td{border-bottom:0}table.gt td input,.sch-table td input{width:100%;border:0;border-radius:4px;background:transparent;font-size:15px;min-height:32px}table.gt td input[type=number]{text-align:center;font-variant-numeric:tabular-nums;color:var(--green);font-weight:600}.add-btn{display:inline-flex;align-items:center;min-height:44px;padding:8px 3px;border:0;background:none;color:var(--green);font-size:13px;font-weight:600}
.day-bar{margin-bottom:18px}.day-btn{border:1px solid var(--line);border-radius:13px;background:var(--surface);padding:10px 0;color:var(--muted);text-align:center}.db-day{display:block;font-size:12px;font-weight:500}.db-date{display:block;font-size:16px;font-weight:600;margin-top:3px}.day-btn.is-sat:not(.active){color:var(--blue);background:var(--blue-bg)}.day-btn.is-red:not(.active){color:var(--red);background:var(--red-bg)}.day-btn.is-today:not(.active){border:2px solid var(--green)}.day-btn.active{background:var(--green);border-color:var(--green);color:#fff}.daily-day-header{display:flex;align-items:center;gap:13px;padding:20px;margin-bottom:18px;background:var(--green-soft);border:1px solid var(--line);border-radius:var(--r)}.ddh-icon{font-size:26px}.ddh-day{font-size:20px;font-weight:700;color:var(--green);letter-spacing:-.6px}.ddh-date{font-size:13px;color:var(--muted);margin-top:2px}.sch-wrap{padding:0 16px 18px}.sch-table th:first-child{width:64px!important}.sch-table td{padding:5px 8px;border-bottom:1px solid var(--line);vertical-align:middle}.sch-table td.tm{width:64px;font-size:12px;font-weight:500;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}.sch-table tr:nth-child(even){background:var(--bg)}.backup-toggle{display:block;width:calc(100% - 40px);margin:0 20px 14px;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--green);font-size:12px;min-height:40px}.work-collapse-btn{display:flex;align-items:center;justify-content:center;gap:6px;width:100%;min-height:44px;margin:8px 0;border:1px dashed var(--line);border-radius:9px;background:var(--green-soft);font-size:12px;color:var(--green)}.arrow{font-size:10px}.work-hours-block{overflow:hidden;transition:max-height .25s ease}.item-row{display:flex;align-items:center;gap:10px;min-height:48px;padding:8px 0;border-bottom:1px solid var(--line)}.item-row:last-child{border:0}.chk{width:20px;height:20px;flex-shrink:0;accent-color:var(--green);cursor:pointer}.item-inp{flex:1;width:100%;border:0;background:transparent;font-size:15px;min-height:32px}.item-inp.done{text-decoration:line-through;color:var(--muted)}.study-tag{padding:5px 9px;border-radius:8px;background:var(--green-soft);color:var(--green);font-size:12px;font-weight:600;cursor:pointer;max-width:100px;overflow-wrap:anywhere}.save-row{display:flex;align-items:center;gap:14px;margin-top:22px}.save-btn{padding:13px 30px;min-height:48px;border:0;border-radius:13px;background:var(--green);color:#fff;font-size:15px;font-weight:600;box-shadow:0 4px 12px #38624f18}.saved-msg{font-size:13px;color:var(--green);opacity:0;transition:opacity .2s}button:active{transform:translateY(1px)}
@media(hover:hover){.week-nav-btn:hover,.backup-toggle:hover{background:var(--green-soft)}.save-btn:hover{filter:brightness(.93)}}
@media(min-width:700px){body{padding-top:20px}.app-header{padding-top:26px}}
@media(max-width:380px){body{padding-inline:6px}.content{padding-inline:4px}.app-header{padding-inline:6px}.app-title{font-size:22px}.week-badge{font-size:10px;padding:5px 7px}.card-header{padding-inline:15px}.card-body{padding-inline:14px}.week-label-big{font-size:13px}table.gt th,table.gt td{padding-inline:7px}}
@media(pointer:coarse){input,textarea.field,table.gt td input,.sch-table td input,.item-inp{font-size:16px}}
@media(prefers-color-scheme:dark){:root{color-scheme:dark;--bg:#1c2420;--surface:#252f29;--soft:#2e3a32;--line:#435247;--ink:#e4e9e0;--muted:#b0bdaf;--green:#afd2b6;--green-soft:#33493b;--blue:#b0cbe0;--blue-bg:#2d3c47;--red:#edb6aa;--red-bg:#47332f;--shadow:none}.save-btn,.day-btn.active,.wdc-today{background:#afd2b6;color:#203a29}.wdc-today .wdc-day{color:#203a29}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{transition:none!important;scroll-behavior:auto!important}}
</style>
</head>
<body>

<div class="app-header">
  <div class="header-top">
    <div>
      <div class="app-title-sub">MY DAILY PLANNER</div>
      <div class="app-title">데일리 플래너</div>
    </div>
    <div class="week-badge" id="week-badge">주간 선택</div>
  </div>
</div>

<div class="tab-bar">
  <button type="button" class="tab active" onclick="switchTab('weekly')">주간 계획</button>
  <button type="button" class="tab" onclick="switchTab('daily')">일일 플래너</button>
</div>

<div class="content">

  <!-- ══ WEEKLY ══ -->
  <div class="page active" id="page-weekly">

    <div class="card">
      <div class="card-header">
        <div class="card-icon">🗓</div>
        <div class="card-title">주간 선택</div>
      </div>
      <div class="card-body">
        <div class="week-nav">
          <button class="week-nav-btn" aria-label="이전 주" onclick="changeWeek(-1)">‹</button>
          <div class="week-label-big" id="week-label-big">—</div>
          <button class="week-nav-btn" aria-label="다음 주" onclick="changeWeek(1)">›</button>
        </div>
        <div class="week-dates-row" id="week-dates-row"></div>
      </div>
    </div>

    <div class="card">
      <div class="card-header">
        <div class="card-icon">💭</div>
        <div class="card-title">지난주 돌아보기</div>
      </div>
      <div class="card-body">
        <div class="sec-divider"><div class="sdiv-bar"></div><div class="sdiv-label">잘 된 점</div><div class="sdiv-bar"></div></div>
        <textarea class="field" id="review-good" placeholder="지난 한 주 잘 된 점을 돌아보세요..."></textarea>
        <div class="sec-divider" style="margin-top:10px"><div class="sdiv-bar"></div><div class="sdiv-label">개선할 점</div><div class="sdiv-bar"></div></div>
        <textarea class="field" id="review-improve" placeholder="다음 주엔 어떻게 더 잘할 수 있을까요..."></textarea>
      </div>
    </div>

    <div class="card">
      <div class="card-header">
        <div class="card-icon">📊</div>
        <div class="card-title">핵심 지표</div>
      </div>
      <table class="gt">
        <thead><tr><th>항목</th><th style="width:52px;text-align:center">목표</th><th style="width:52px;text-align:center">실제</th></tr></thead>
        <tbody id="ki-body"></tbody>
      </table>
      <div style="padding:4px 16px 10px"><button class="add-btn" onclick="addKI()">＋ 항목 추가</button></div>
    </div>

    <div class="card">
      <div class="card-header">
        <div class="card-icon">🎯</div>
        <div class="card-title">이번 주 집중해서 할 일</div>
      </div>
      <table class="gt">
        <thead><tr><th>할 일</th><th>구체적 행동</th></tr></thead>
        <tbody id="focus-body"></tbody>
      </table>
      <div style="padding:4px 16px 10px"><button class="add-btn" onclick="addFocus()">＋ 추가</button></div>
    </div>

    <div class="card">
      <div class="card-header">
        <div class="card-icon">✨</div>
        <div class="card-title">기타 개인 목표</div>
      </div>
      <div class="card-body">
        <textarea class="field" id="other-goals" placeholder="이번 주 개인 목표를 자유롭게 적어주세요..."></textarea>
      </div>
    </div>

    <div class="save-row">
      <button class="save-btn" onclick="saveWeekly()">저장하기</button>
      <span class="saved-msg" id="weekly-saved">✓ 저장됨</span>
    </div>
  </div>

  <!-- ══ DAILY ══ -->
  <div class="page" id="page-daily">

    <div class="day-bar" id="day-selector"></div>

    <div class="daily-day-header">
      <div class="ddh-icon">📅</div>
      <div>
        <div class="ddh-day" id="ddh-text"></div>
        <div class="ddh-date" id="ddh-sub"></div>
      </div>
    </div>

    <div class="card">
      <div class="card-header">
        <div class="card-icon">⏰</div>
        <div class="card-title">시간별 일정</div>
      </div>
      <button class="backup-toggle" id="backup-btn" onclick="toggleBackup()">백업 플랜 보기</button>
      <div class="sch-wrap">
        <!-- 구역 1: 06:00~07:30 항상 표시 -->
        <table class="sch-table">
          <thead><tr><th style="width:38px">시간</th><th>플랜</th><th id="backup-th" style="display:none">백업 플랜</th></tr></thead>
          <tbody id="zone-before"></tbody>
        </table>
        <!-- 구역 2: 08:00~17:00 평일만 접기 -->
        <button class="work-collapse-btn collapsed" id="work-collapse-btn" onclick="toggleWorkHours()" style="display:none">
          <span class="arrow">▲</span> 08:00 ~ 17:00 업무시간 펼치기
        </button>
        <div class="work-hours-block" id="work-hours-block" style="max-height:0;overflow:hidden">
          <table class="sch-table"><tbody id="zone-work"></tbody></table>
        </div>
        <!-- 구역 3: 17:00~22:00 항상 표시 -->
        <table class="sch-table" id="zone-after-table">
          <tbody id="zone-after"></tbody>
        </table>
      </div>
    </div>

    <div class="card">
      <div class="card-header">
        <div class="card-icon">📝</div>
        <div class="card-title">메모 / 노트</div>
      </div>
      <div class="card-body">
        <textarea class="field" id="daily-memo" placeholder="오늘의 메모..."></textarea>
      </div>
    </div>

    <div class="card">
      <div class="card-header">
        <div class="card-icon">🔔</div>
        <div class="card-title">중요 일정</div>
      </div>
      <div class="card-body">
        <textarea class="field" id="daily-important" placeholder="오늘 꼭 챙길 일정..." style="min-height:52px"></textarea>
      </div>
    </div>

    <div class="card">
      <div class="card-header">
        <div class="card-icon">✅</div>
        <div class="card-title">오늘의 할 일</div>
      </div>
      <div class="card-body">
        <div id="todo-list"></div>
        <button class="add-btn" onclick="addTodo()">＋ 할 일 추가</button>
      </div>
    </div>

    <div class="card">
      <div class="card-header">
        <div class="card-icon">📚</div>
        <div class="card-title">공부 계획 / 목표</div>
      </div>
      <div class="card-body">
        <div id="study-list"></div>
        <button class="add-btn" onclick="addStudy()">＋ 과목 추가</button>
      </div>
    </div>

    <div class="save-row">
      <button class="save-btn" onclick="saveDaily()">저장하기</button>
      <span class="saved-msg" id="daily-saved">✓ 저장됨</span>
    </div>
  </div>

</div>

<script>
const DAYS_KO=['월','화','수','목','금','토','일'];
// 08:00~17:00 근무시간 인덱스: TIMES 배열에서 '8:00'(idx4)~'17:00'(idx13)
const TIMES=['6:00','6:30','7:00','7:30','8:00','9:00','10:00','11:00','12:00','13:00','14:00','15:00','16:00','17:00','18:00','19:00','19:30','20:00','20:30','21:00','21:30','22:00'];
const WORK_START=4; // TIMES index for 8:00
const WORK_END=13;  // TIMES index for 17:00 (inclusive)

// 2025~2026 대한민국 공휴일 (YYYY-MM-DD)
const HOLIDAYS=new Set([
  '2025-01-01','2025-01-28','2025-01-29','2025-01-30',
  '2025-03-01','2025-05-05','2025-05-06','2025-06-06',
  '2025-08-15','2025-10-03','2025-10-05','2025-10-06','2025-10-07','2025-10-08','2025-10-09',
  '2025-12-25',
  '2026-01-01','2026-02-17','2026-02-18','2026-02-19',
  '2026-03-01','2026-03-02','2026-05-05','2026-05-25','2026-06-06',
  '2026-08-15','2026-09-24','2026-09-25','2026-09-26',
  '2026-10-03','2026-10-09','2026-12-25'
]);

function isHoliday(date){return HOLIDAYS.has(dateKey(date));}
function isSat(date){return date.getDay()===6;}
function isSun(date){return date.getDay()===0;}
function isRed(date){return isSun(date)||isHoliday(date);}
function isWeekday(date){return !isSat(date)&&!isSun(date)&&!isHoliday(date);}
let currentDay=0,backupVisible=false;
let weekMonday=getThisWeekMonday();
let data={weekly:{},daily:{}};

function getThisWeekMonday(){const d=new Date();d.setHours(0,0,0,0);const dow=d.getDay();d.setDate(d.getDate()+(dow===0?-6:1-dow));return d;}
function addDays(date,n){const d=new Date(date);d.setDate(d.getDate()+n);return d;}
function dateKey(d){return d.toISOString().slice(0,10);}
function weekKey(m){return dateKey(m);}
function getWeekDates(m){return Array.from({length:7},(_,i)=>addDays(m,i));}
function formatFull(d){const dn=['일','월','화','수','목','금','토'];return(d.getMonth()+1)+'월 '+d.getDate()+'일 ('+dn[d.getDay()]+')';}

function changeWeek(dir){weekMonday=addDays(weekMonday,dir*7);renderWeekHeader();updateDayBar();updateDailyHeader();}

function renderWeekHeader(){
  const dates=getWeekDates(weekMonday);
  const sun=dates[6];
  const label=(weekMonday.getMonth()+1)+'월 '+weekMonday.getDate()+'일 ~ '+(sun.getMonth()+1)+'월 '+sun.getDate()+'일';
  document.getElementById('week-label-big').textContent=label;
  document.getElementById('week-badge').textContent=label;
  const row=document.getElementById('week-dates-row');row.innerHTML='';
  const todayStr=dateKey(new Date());
  dates.forEach((d,i)=>{
    const cell=document.createElement('div');
    cell.className='week-date-cell'+(dateKey(d)===todayStr?' wdc-today':'')+(isSat(d)?' wdc-sat':'')+(isRed(d)?' wdc-red':'');
    cell.innerHTML=`<div class="wdc-day">${DAYS_KO[i]}</div><div class="wdc-date">${d.getDate()}</div>`;
    row.appendChild(cell);
  });
  loadWeeklyData(weekKey(weekMonday));
}

function loadWeeklyData(wk){
  const wd=data.weekly[wk]||{};
  document.getElementById('review-good').value=wd.review_good||'';
  document.getElementById('review-improve').value=wd.review_improve||'';
  document.getElementById('other-goals').value=wd.other||'';
  document.getElementById('ki-body').innerHTML='';
  document.getElementById('focus-body').innerHTML='';
  (wd.ki||[]).forEach(k=>addKI(k.label,k.goal,k.actual));
  (wd.focus||[]).forEach(f=>addFocus(f.task,f.action));
  if(!(wd.ki&&wd.ki.length)){addKI();addKI();addKI();}
  if(!(wd.focus&&wd.focus.length)){addFocus();addFocus();addFocus();}
}

function switchTab(tab){
  document.querySelectorAll('.tab').forEach((t,i)=>t.classList.toggle('active',['weekly','daily'][i]===tab));
  document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
  document.getElementById('page-'+tab).classList.add('active');
}

function addKI(label='',goal='',actual=''){
  const tr=document.createElement('tr');
  tr.innerHTML=`<td><input type="text" value="${label}" placeholder="항목명" oninput="syncKI()"/></td>
    <td style="text-align:center"><input type="number" value="${goal}" placeholder="0" oninput="syncKI()"/></td>
    <td style="text-align:center"><input type="number" value="${actual}" placeholder="0" oninput="syncKI()"/></td>`;
  document.getElementById('ki-body').appendChild(tr);
}
function syncKI(){const wk=weekKey(weekMonday);if(!data.weekly[wk])data.weekly[wk]={};data.weekly[wk].ki=Array.from(document.querySelectorAll('#ki-body tr')).map(r=>{const ins=r.querySelectorAll('input');return{label:ins[0].value,goal:ins[1].value,actual:ins[2].value};});}

function addFocus(task='',action=''){
  const tr=document.createElement('tr');
  tr.innerHTML=`<td><input type="text" value="${task}" placeholder="집중할 일" oninput="syncFocus()"/></td>
    <td><input type="text" value="${action}" placeholder="구체적 행동" oninput="syncFocus()"/></td>`;
  document.getElementById('focus-body').appendChild(tr);
}
function syncFocus(){const wk=weekKey(weekMonday);if(!data.weekly[wk])data.weekly[wk]={};data.weekly[wk].focus=Array.from(document.querySelectorAll('#focus-body tr')).map(r=>{const ins=r.querySelectorAll('input');return{task:ins[0].value,action:ins[1].value};});}

function updateDayBar(){
  const c=document.getElementById('day-selector');c.innerHTML='';
  const dates=getWeekDates(weekMonday);
  const todayStr=dateKey(new Date());
  dates.forEach((d,i)=>{
    const b=document.createElement('button');
    let cls='day-btn';
    if(i===currentDay)cls+=' active';
    if(dateKey(d)===todayStr)cls+=' is-today';
    if(isSat(d))cls+=' is-sat';
    if(isRed(d))cls+=' is-red';
    b.className=cls;
    b.innerHTML=`<span class="db-day">${DAYS_KO[i]}</span><span class="db-date">${d.getDate()}</span>`;
    b.onclick=()=>selectDay(i);
    c.appendChild(b);
  });
}

function updateDailyHeader(){
  const d=getWeekDates(weekMonday)[currentDay];
  document.getElementById('ddh-text').textContent=DAYS_KO[currentDay]+'요일';
  document.getElementById('ddh-sub').textContent=formatFull(d);
}

function currentDateKey(){return dateKey(getWeekDates(weekMonday)[currentDay]);}
function currentDayData(){
  const dk=currentDateKey();
  if(!data.daily[dk])data.daily[dk]={schedule:TIMES.map(()=>({plan:'',backup:''})),memo:'',important:'',todos:[],studies:[]};
  return data.daily[dk];
}

function selectDay(i){
  currentDay=i;updateDayBar();updateDailyHeader();
  const d=currentDayData();
  renderSchedule();
  document.getElementById('daily-memo').value=d.memo||'';
  document.getElementById('daily-important').value=d.important||'';
  renderTodos();renderStudies();
}

function toggleBackup(){
  backupVisible=!backupVisible;
  document.getElementById('backup-th').style.display=backupVisible?'':'none';
  document.querySelectorAll('#zone-before td:nth-child(3),#zone-work td:nth-child(3),#zone-after td:nth-child(3)').forEach(td=>td.style.display=backupVisible?'':'none');
  document.getElementById('backup-btn').textContent=backupVisible?'백업 플랜 숨기기':'백업 플랜 보기';
}

let workCollapsed=true;

function toggleWorkHours(){
  workCollapsed=!workCollapsed;
  const btn=document.getElementById('work-collapse-btn');
  const block=document.getElementById('work-hours-block');
  if(workCollapsed){
    block.style.maxHeight='0';
    btn.classList.add('collapsed');
    btn.innerHTML='<span class="arrow">▲</span> 08:00 ~ 17:00 업무시간 펼치기';
  } else {
    block.style.maxHeight=block.scrollHeight+'px';
    btn.classList.remove('collapsed');
    btn.innerHTML='<span class="arrow">▼</span> 08:00 ~ 17:00 업무시간 접기';
  }
}

function makeRow(t, i, bkpDisplay){
  const d=currentDayData();
  if(!d.schedule[i])d.schedule[i]={plan:'',backup:''};
  const tr=document.createElement('tr');
  tr.innerHTML=`<td class="tm">${t}</td>
    <td><input type="text" value="${d.schedule[i].plan}" oninput="currentDayData().schedule[${i}].plan=this.value"/></td>
    <td style="display:${bkpDisplay}"><input type="text" value="${d.schedule[i].backup}" oninput="currentDayData().schedule[${i}].backup=this.value"/></td>`;
  return tr;
}

function renderSchedule(){
  const curDate=getWeekDates(weekMonday)[currentDay];
  const weekday=isWeekday(curDate);
  const bkp=backupVisible?'':'none';

  const zoneBefore=document.getElementById('zone-before');
  const zoneWork=document.getElementById('zone-work');
  const zoneAfter=document.getElementById('zone-after');
  const colBtn=document.getElementById('work-collapse-btn');
  const colBlock=document.getElementById('work-hours-block');

  zoneBefore.innerHTML='';
  zoneWork.innerHTML='';
  zoneAfter.innerHTML='';

  TIMES.forEach((t,i)=>{
    const tr=makeRow(t,i,bkp);
    if(i < WORK_START){
      // 06:00~07:30 — 항상 위쪽 구역
      zoneBefore.appendChild(tr);
    } else if(i >= WORK_START && i <= WORK_END){
      if(weekday){
        // 평일: 접히는 구역에 배치
        zoneWork.appendChild(tr);
      } else {
        // 주말/공휴일: 아래 구역에 연속 표시
        zoneAfter.appendChild(tr);
      }
    } else {
      // 17:00~22:00 — 항상 아래 구역
      zoneAfter.appendChild(tr);
    }
  });

  // 접기 버튼 — 평일만
  if(weekday){
    colBtn.style.display='flex';
    if(workCollapsed){
      colBlock.style.maxHeight='0';
      colBtn.classList.add('collapsed');
      colBtn.innerHTML='<span class="arrow">▲</span> 08:00 ~ 17:00 업무시간 펼치기';
    } else {
      colBlock.style.maxHeight=colBlock.scrollHeight+'px';
      colBtn.classList.remove('collapsed');
      colBtn.innerHTML='<span class="arrow">▼</span> 08:00 ~ 17:00 업무시간 접기';
    }
  } else {
    colBtn.style.display='none';
    colBlock.style.maxHeight='none';
  }
}

function renderTodos(){
  const d=currentDayData();const c=document.getElementById('todo-list');c.innerHTML='';
  (d.todos||[]).forEach((todo,i)=>{
    const row=document.createElement('div');row.className='item-row';
    row.innerHTML=`<input type="checkbox" class="chk" ${todo.done?'checked':''} onchange="toggleTodo(${i})"/>
      <input class="item-inp${todo.done?' done':''}" type="text" value="${todo.text||''}" placeholder="할 일 입력..." oninput="currentDayData().todos[${i}].text=this.value"/>`;
    c.appendChild(row);
  });
}
function addTodo(){currentDayData().todos.push({text:'',done:false});renderTodos();const ins=document.querySelectorAll('#todo-list .item-inp');if(ins.length)ins[ins.length-1].focus();}
function toggleTodo(i){currentDayData().todos[i].done=!currentDayData().todos[i].done;renderTodos();}

function renderStudies(){
  const d=currentDayData();const c=document.getElementById('study-list');c.innerHTML='';
  (d.studies||[]).forEach((s,i)=>{
    const row=document.createElement('div');row.className='item-row';
    row.innerHTML=`<span class="study-tag" onclick="renameStudy(${i})">${s.subject||'과목'}</span>
      <input class="item-inp" type="text" value="${s.goal||''}" placeholder="오늘의 목표..." oninput="currentDayData().studies[${i}].goal=this.value"/>`;
    c.appendChild(row);
  });
}
function addStudy(){
  const subj=prompt('과목/분야 이름\n(예: 수학, 영어, SwiftUI)');
  if(subj===null)return;
  currentDayData().studies.push({subject:subj||'과목',goal:''});
  renderStudies();
  const ins=document.querySelectorAll('#study-list .item-inp');if(ins.length)ins[ins.length-1].focus();
}
function renameStudy(i){
  const cur=currentDayData().studies[i].subject;
  const n=prompt('이름 변경',cur);
  if(n!==null){currentDayData().studies[i].subject=n||cur;renderStudies();}
}

document.getElementById('daily-memo').addEventListener('input',e=>{currentDayData().memo=e.target.value;});
document.getElementById('daily-important').addEventListener('input',e=>{currentDayData().important=e.target.value;});
document.getElementById('review-good').addEventListener('input',e=>{const wk=weekKey(weekMonday);if(!data.weekly[wk])data.weekly[wk]={};data.weekly[wk].review_good=e.target.value;});
document.getElementById('review-improve').addEventListener('input',e=>{const wk=weekKey(weekMonday);if(!data.weekly[wk])data.weekly[wk]={};data.weekly[wk].review_improve=e.target.value;});
document.getElementById('other-goals').addEventListener('input',e=>{const wk=weekKey(weekMonday);if(!data.weekly[wk])data.weekly[wk]={};data.weekly[wk].other=e.target.value;});

function flash(id){const el=document.getElementById(id);el.style.opacity=1;setTimeout(()=>el.style.opacity=0,2200);}

function saveWeekly(){
  syncKI();syncFocus();
  const wk=weekKey(weekMonday);if(!data.weekly[wk])data.weekly[wk]={};
  data.weekly[wk].review_good=document.getElementById('review-good').value;
  data.weekly[wk].review_improve=document.getElementById('review-improve').value;
  data.weekly[wk].other=document.getElementById('other-goals').value;
  try{localStorage.setItem('planner_weekly',JSON.stringify(data.weekly));}catch(e){}
  flash('weekly-saved');
}
function saveDaily(){
  currentDayData().memo=document.getElementById('daily-memo').value;
  currentDayData().important=document.getElementById('daily-important').value;
  try{localStorage.setItem('planner_daily',JSON.stringify(data.daily));}catch(e){}
  flash('daily-saved');
}
function loadSaved(){
  try{
    const w=localStorage.getItem('planner_weekly');if(w)data.weekly=JSON.parse(w);
    const d=localStorage.getItem('planner_daily');if(d)data.daily=JSON.parse(d);
  }catch(e){}
}

loadSaved();
renderWeekHeader();
updateDayBar();
updateDailyHeader();
selectDay(0);
</script>
</body>
</html>
